<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="description" content="Gram Tutor – Learn English grammar with clear lessons, quizzes, and practice games. Built by Tasmon Islam." />
  <meta name="theme-color" content="#3b5bdb" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gram Tutor" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>Gram Tutor – English Grammar Lessons and Practice</title>
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <button type="button" class="logo" data-nav="home" aria-label="Home">
        <span class="logo-mark">G</span>
        <span class="logo-text">Gram Tutor</span>
      </button>
      <div class="header-right">
        <span class="xp-pill" id="xpPill" title="Your XP">⭐ 0 XP</span>
        <button type="button" class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
      </div>
    </header>

    <nav class="top-nav" id="topNav" aria-label="Main">
      <button type="button" class="nav-item active" data-nav="home">🏠 Home</button>
      <button type="button" class="nav-item" data-nav="lessons">📚 Lessons</button>
      <button type="button" class="nav-item" data-nav="practice">🎯 Practice</button>
      <button type="button" class="nav-item" data-nav="tools">🛠️ Tools</button>
      <button type="button" class="nav-item" data-nav="progress">📊 Progress</button>
      <button type="button" class="nav-item" data-nav="about">ℹ️ About</button>
    </nav>

    <main id="main" class="main" role="main"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Mobile">
      <button type="button" class="bnav-item active" data-nav="home"><span>🏠</span><small>Home</small></button>
      <button type="button" class="bnav-item" data-nav="lessons"><span>📚</span><small>Lessons</small></button>
      <button type="button" class="bnav-item" data-nav="practice"><span>🎯</span><small>Practice</small></button>
      <button type="button" class="bnav-item" data-nav="tools"><span>🛠️</span><small>Tools</small></button>
      <button type="button" class="bnav-item" data-nav="progress"><span>📊</span><small>Progress</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js').catch(function(){});
      });
    }
  </script>
</body>
</html>
