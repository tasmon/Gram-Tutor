<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="description" content="My Gramify - in-depth English grammar lessons, a placement test, adaptive quizzes with explanations, a mistake-review queue, and practice games. Built by Tasmon Islam." />
  <meta name="theme-color" content="#4c63e8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My Gramify" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <title>My Gramify - English Grammar Practice</title>
</head>
<body>
  <div id="app" class="app">
    <header class="header">
      <button type="button" class="logo" data-nav="home" aria-label="Home">
        <span class="logo-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="32" height="32" aria-hidden="true">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#5b7cfa"/>
                <stop offset="55%" stop-color="#4c63e8"/>
                <stop offset="100%" stop-color="#3b46c9"/>
              </linearGradient>
              <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </linearGradient>
            </defs>
            <rect x="1" y="1" width="62" height="62" rx="17" fill="url(#g)"/>
            <rect x="1" y="1" width="62" height="30" rx="17" fill="url(#gs)"/>
            <g transform="translate(32,34)">
              <path d="M -20 -8 C -13 -12 -6 -12 0 -8 L 0 15 C -6 11 -13 11 -20 15 Z" fill="#fff" opacity="0.97"/>
              <path d="M 20 -8 C 13 -12 6 -12 0 -8 L 0 15 C 6 11 13 11 20 15 Z" fill="#fff" opacity="0.88"/>
              <path d="M -15.5 -3.4 C -10.5 -6 -5.5 -6 -1.8 -3.6" stroke="#4c63e8" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.55"/>
              <path d="M -15.5 2.6 C -10.5 0 -5.5 0 -1.8 2.4" stroke="#4c63e8" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.55"/>
              <path d="M 15.5 -3.4 C 10.5 -6 5.5 -6 1.8 -3.6" stroke="#4c63e8" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.4"/>
              <path d="M 15.5 2.6 C 10.5 0 5.5 0 1.8 2.4" stroke="#4c63e8" stroke-width="1.7" fill="none" stroke-linecap="round" opacity="0.4"/>
            </g>
            <circle cx="47.5" cy="18.5" r="11.5" fill="#22b25c" stroke="var(--card,#fff)" stroke-width="2.6"/>
            <path d="M 42.3 18.7 L 46.1 22.4 L 53 15.2" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="logo-text">My Gramify</span>
      </button>
      <div class="header-right">
        <span class="xp-pill" id="xpPill" title="Your XP">⭐ 0 XP</span>
        <button type="button" class="icon-btn" id="themeBtn" title="Change theme" aria-label="Change theme">🎨</button>
      </div>
    </header>

    <nav class="top-nav" id="topNav" aria-label="Main">
      <button type="button" class="nav-item active" data-nav="home">🏠 Home</button>
      <button type="button" class="nav-item" data-nav="lessons">📚 Lessons</button>
      <button type="button" class="nav-item" data-nav="practice">🎯 Practice</button>
      <button type="button" class="nav-item" data-nav="tools">🛠️ Tools</button>
      <button type="button" class="nav-item" data-nav="progress">📊 Progress</button>
      <button type="button" class="nav-item" data-nav="about">ℹ️ About</button>
    </nav>

    <main id="main" class="main" role="main"></main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Mobile">
      <button type="button" class="bnav-item active" data-nav="home"><span>🏠</span><small>Home</small></button>
      <button type="button" class="bnav-item" data-nav="lessons"><span>📚</span><small>Lessons</small></button>
      <button type="button" class="bnav-item" data-nav="practice"><span>🎯</span><small>Practice</small></button>
      <button type="button" class="bnav-item" data-nav="tools"><span>🛠️</span><small>Tools</small></button>
      <button type="button" class="bnav-item" data-nav="progress"><span>📊</span><small>Progress</small></button>
      <button type="button" class="bnav-item" data-nav="about"><span>ℹ️</span><small>About</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-action="close-modal"></div>
    <div class="modal-box" id="modalBox"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/questionbank.js"></script>
  <script src="js/quizgen.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
